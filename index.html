<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sunskip</title>
<meta name="description" content="Sunskip: a pastel 3D runner over a tiny moon. Skim the dunes, graze the crystals, beat today's run.">
<meta name="theme-color" content="#FFF3E2">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2218%22%20r%3D%2211%22%20fill%3D%22%23FF7A6B%22%20stroke%3D%22%232F2A55%22%20stroke-width%3D%223%22%2F%3E%3Cpath%20d%3D%22M3%2022h26%22%20stroke%3D%22%232F2A55%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M16%204l4%205-4%205-4-5z%22%20fill%3D%22%23FFE07A%22%20stroke%3D%22%232F2A55%22%20stroke-width%3D%222%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
:root {
  --ink: #2F2A55;
  --ink-soft: #5B5590;
  --cream: #FFF3E2;
  --paper: #FFF9F1;
  --peach: #FFC9A3;
  --coral: #FF7A6B;
  --mint: #8FD9C1;
  --lilac: #B9A8F5;
  --butter: #FFE07A;
  --display: "Dela Gothic One", "Arial Black", Impact, system-ui, sans-serif;
  --ui: "M PLUS Rounded 1c", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --stroke: 2.5px;
  --lift: 0 4px 0 var(--ink);
  --lift-lg: 0 7px 0 var(--ink);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --outline: 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 2px 0 var(--ink), 0 -2px 0 var(--ink),
    2px 2px 0 var(--ink), -2px 2px 0 var(--ink), 2px -2px 0 var(--ink), -2px -2px 0 var(--ink);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--ui);
  font-weight: 500;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
button { font: inherit; color: inherit; }
input { font: inherit; user-select: text; -webkit-user-select: text; }
[hidden] { display: none !important; }
.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.ic.fill { fill: currentColor; }
.shard-ic { fill: var(--butter); stroke: var(--ink); }

/* ---------- stage ---------- */
#app {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  background:
    radial-gradient(circle at 20% 15%, rgba(255, 201, 163, .55), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(185, 168, 245, .45), transparent 50%),
    var(--cream);
}
#stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: #FFE9D2; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#app.capture #stage {
  width: auto; height: calc(100% - 32px); aspect-ratio: 9 / 16; max-width: calc(100% - 32px);
  border-radius: 22px; box-shadow: 0 0 0 var(--stroke) var(--ink), 0 9px 0 var(--ink);
}
#vignette {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(47, 42, 85, .16));
}
#fx-speed {
  position: absolute; inset: -20%; pointer-events: none; opacity: 0; transition: opacity .35s;
  background: repeating-conic-gradient(from 0deg at 50% 46%, rgba(255, 249, 241, .0) 0 7deg, rgba(255, 249, 241, .55) 7.4deg 7.9deg, rgba(255, 249, 241, 0) 8.3deg 15deg);
  -webkit-mask: radial-gradient(circle at 50% 46%, transparent 26%, #000 62%);
  mask: radial-gradient(circle at 50% 46%, transparent 26%, #000 62%);
}
#fx-speed.on { opacity: 1; animation: spin 1.4s linear infinite; }
@keyframes spin { to { transform: rotate(8deg); } }
#fx-fever {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .5s;
  box-shadow: inset 0 0 0 6px var(--butter), inset 0 0 90px rgba(255, 224, 122, .7);
}
#fx-fever.on { opacity: 1; animation: feverPulse .9s ease-in-out infinite alternate; }
@keyframes feverPulse { from { box-shadow: inset 0 0 0 5px var(--butter), inset 0 0 60px rgba(255, 224, 122, .5); } to { box-shadow: inset 0 0 0 9px var(--butter), inset 0 0 120px rgba(255, 201, 163, .8); } }
#flash { position: absolute; inset: 0; background: var(--paper); opacity: 0; pointer-events: none; }
#flash.hit { animation: flash .5s ease-out; }
@keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }

/* ---------- buttons ---------- */
.btn {
  --bg: var(--paper);
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  min-height: 48px; padding: .55em 1.1em;
  border: var(--stroke) solid var(--ink); border-radius: 16px;
  background: var(--bg); color: var(--ink);
  font-weight: 800; font-size: 16px; letter-spacing: .01em; line-height: 1.1;
  box-shadow: var(--lift);
  cursor: pointer; transition: transform .08s, box-shadow .08s, background-color .2s;
  touch-action: manipulation;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 5px 0 var(--ink); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn:focus-visible, .chip:focus-visible, .tab:focus-visible, .skin:focus-visible, .toggle:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid var(--coral); outline-offset: 3px;
}
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; box-shadow: var(--lift); }
.btn-coral { --bg: var(--coral); }
.btn-mint { --bg: var(--mint); }
.btn-butter { --bg: var(--butter); }
.btn-lilac { --bg: var(--lilac); }
.btn-peach { --bg: var(--peach); }
.btn-xl {
  min-height: 74px; padding: .5em 1.3em; border-radius: 22px; box-shadow: var(--lift-lg);
  flex-direction: column; align-items: flex-start; gap: 2px; text-align: left;
}
.btn-xl:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
.btn-xl .big { font-family: var(--display); font-weight: 400; font-size: 26px; letter-spacing: .02em; }
.btn-xl small { font-size: 13px; font-weight: 700; opacity: .8; }
.btn-icon { min-height: 44px; width: 44px; padding: 0; border-radius: 14px; }
.btn-sq { flex-direction: column; gap: 4px; min-height: 64px; padding: .5em .3em; font-size: 12.5px; border-radius: 18px; position: relative; }
.btn-sq .ic { width: 24px; height: 24px; }
.dot {
  position: absolute; top: -8px; right: -6px; min-width: 22px; height: 22px; padding: 0 6px;
  border-radius: 11px; border: 2px solid var(--ink); background: var(--coral);
  font-size: 12px; font-weight: 800; display: grid; place-items: center;
}
.chip {
  display: inline-flex; align-items: center; justify-content: center; gap: .4em; min-height: 44px; min-width: 44px; padding: 0 .9em;
  border: var(--stroke) solid var(--ink); border-radius: 999px; background: var(--paper);
  font-weight: 800; font-size: 14px; box-shadow: 0 3px 0 var(--ink); cursor: pointer; touch-action: manipulation;
}
.chip:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.chip.on { background: var(--butter); }
.chip .ic { width: 20px; height: 20px; }

/* ---------- screens ---------- */
.screen { position: absolute; inset: 0; pointer-events: none; }
.screen > * { pointer-events: auto; }

/* menu */
#menu {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto 1fr auto auto;
  padding: calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 14px);
  gap: 12px;
}
.menu-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.brand-mini { font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); opacity: .75; }
.menu-top .chips { display: flex; gap: 8px; }
.menu-hero { align-self: start; padding-top: 2vh; pointer-events: none; }
.logo {
  margin: 0; font-family: var(--display); font-weight: 400;
  font-size: clamp(42px, 13.4vw, 148px); line-height: .95; letter-spacing: .01em;
  display: flex; flex-wrap: nowrap;
}
.logo span {
  display: inline-block; color: var(--c, var(--coral));
  text-shadow: var(--outline), 0 5px 0 var(--ink), 2px 6px 0 var(--ink), -2px 6px 0 var(--ink), 0 8px 0 var(--ink);
  animation: letterIn .7s cubic-bezier(.3, 1.6, .5, 1) both, bob 3.2s ease-in-out infinite;
  animation-delay: calc(var(--i) * 70ms), calc(900ms + var(--i) * 160ms);
}
@keyframes letterIn { from { transform: translateY(-60px) rotate(-12deg) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.tagline {
  margin: 14px 0 0; max-width: 30ch; font-size: clamp(15px, 3.8vw, 18px); font-weight: 700; line-height: 1.4;
  text-wrap: balance;
}
.tagline em { font-style: normal; background: var(--butter); padding: 0 .25em; border-radius: 6px; box-shadow: 0 0 0 2px var(--ink); }
.menu-actions { display: grid; gap: 12px; width: 100%; max-width: 440px; }
.mode-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.menu-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.menu-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 12.5px; font-weight: 700; }
.keys { opacity: .8; }
.keys kbd {
  font: inherit; font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 6px;
  border: 2px solid var(--ink); background: var(--paper); box-shadow: 0 2px 0 var(--ink); margin: 0 2px;
}
.wallet {
  margin-left: auto;
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 8px; border-radius: 999px;
  border: var(--stroke) solid var(--ink); background: var(--paper); font-weight: 800; font-size: 15px;
  font-variant-numeric: tabular-nums; box-shadow: 0 3px 0 var(--ink);
}
.wallet .ic { width: 20px; height: 20px; }
@media (min-width: 900px) and (min-aspect-ratio: 1/1) {
  #menu { grid-template-columns: minmax(0, 560px) 1fr; grid-template-rows: auto 1fr auto auto; padding-inline: 44px; }
  .menu-top { grid-column: 1 / -1; }
  .menu-hero { grid-column: 1; padding-top: 5vh; }
  .menu-actions { grid-column: 1; }
  .menu-foot { grid-column: 1 / -1; }
}
@media (pointer: coarse) { .keys { display: none; } }
@media (max-width: 560px) { .brand-mini { font-size: 10.5px; letter-spacing: .09em; line-height: 1.35; } }
@media (max-width: 380px) {
  .btn-xl .big { font-size: 21px; }
  .btn-sq { font-size: 11px; }
  .menu-row { gap: 6px; }
}
@media (max-height: 640px) and (max-width: 899px) {
  .keys { display: none; }
  .menu-hero { padding-top: 0; }
  .tagline { margin-top: 6px; font-size: 14px; }
}

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
.hud-tl { position: absolute; left: 16px; top: calc(var(--safe-t) + 12px); }
.score {
  font-family: var(--display); font-size: clamp(34px, 8.5vw, 56px); line-height: 1; color: var(--paper);
  text-shadow: var(--outline), 0 4px 0 var(--ink), 2px 4px 0 var(--ink), -2px 4px 0 var(--ink);
  font-variant-numeric: tabular-nums;
}
.score.bump { animation: bump .25s ease-out; }
@keyframes bump { 40% { transform: scale(1.12) rotate(-2deg); } }
.sub {
  margin-top: 8px; display: inline-flex; gap: 8px; align-items: center;
  font-weight: 800; font-size: 13px; padding: 3px 10px; border-radius: 999px;
  background: rgba(255, 249, 241, .85); border: 2px solid var(--ink); font-variant-numeric: tabular-nums;
}
.hud-tr { position: absolute; right: 16px; top: calc(var(--safe-t) + 12px); display: flex; gap: 10px; align-items: center; }
.hud-tr .btn-icon { pointer-events: auto; }
.pill {
  display: inline-flex; gap: 6px; align-items: center; height: 44px; padding: 0 14px 0 10px;
  border-radius: 999px; background: var(--paper); border: var(--stroke) solid var(--ink); box-shadow: var(--lift);
  font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums;
}
.pill .ic { width: 22px; height: 22px; }
.hud-combo {
  position: absolute; left: 50%; top: calc(var(--safe-t) + 78px); transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.hud-combo b {
  font-family: var(--display); font-weight: 400; font-size: 30px; color: var(--butter);
  text-shadow: var(--outline), 0 4px 0 var(--ink);
}
.hud-combo b.up { animation: bump .3s ease-out; }
.hud-combo i { display: block; width: 84px; height: 9px; border-radius: 6px; border: 2px solid var(--ink); background: var(--paper); overflow: hidden; }
.hud-combo i span { display: block; height: 100%; width: 100%; background: var(--coral); transform-origin: left; }
.hud-combo em {
  font-style: normal; font-family: var(--display); font-size: 15px; letter-spacing: .12em; color: var(--ink);
  background: var(--butter); padding: 2px 10px; border-radius: 8px; border: 2px solid var(--ink);
  animation: bob .5s ease-in-out infinite;
}
.hud-power { position: absolute; left: 16px; bottom: calc(var(--safe-b) + 18px); display: flex; gap: 8px; }
.pw {
  display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 6px; border-radius: 12px; border: 2px solid var(--ink);
  background: var(--paper); font-weight: 800; font-size: 12px; box-shadow: 0 3px 0 var(--ink);
}
.pw .sw { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--ink); display: grid; place-items: center; }
.pw .sw .ic { width: 15px; height: 15px; }
.pw i { display: block; width: 44px; height: 6px; border-radius: 4px; background: rgba(47, 42, 85, .15); overflow: hidden; }
.pw i span { display: block; height: 100%; background: var(--ink); transform-origin: left; }
.hud-roll {
  position: absolute; right: 16px; bottom: calc(var(--safe-b) + 18px); width: 50px; height: 50px; border-radius: 50%;
  border: var(--stroke) solid var(--ink); background: conic-gradient(var(--lilac) calc(var(--p, 1) * 360deg), var(--paper) 0);
  display: grid; place-items: center; box-shadow: var(--lift); transition: transform .2s;
}
.hud-roll .ic { width: 24px; height: 24px; }
.hud-roll.ready { background: var(--lilac); }
.hud-roll.ready .ic { animation: wiggle 1.4s ease-in-out infinite; }
@keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 80% { transform: rotate(-25deg); } 90% { transform: rotate(25deg); } }
.banner {
  position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%); text-align: center; opacity: 0;
  font-family: var(--display); font-size: clamp(26px, 7vw, 44px); color: var(--paper); line-height: 1.05;
  text-shadow: var(--outline), 0 5px 0 var(--ink); white-space: nowrap;
}
.banner small { display: block; margin-top: 10px; font-family: var(--ui); font-weight: 800; font-size: 14px; letter-spacing: .14em; color: var(--ink); text-shadow: none; }
.banner.show { animation: banner 2.4s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes banner {
  0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); }
  12% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
  20% { transform: translate(-50%, -50%) scale(1); }
  82% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -62%); }
}
.hint {
  position: absolute; left: 50%; bottom: calc(var(--safe-b) + 92px); transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 16px;
  background: var(--paper); border: var(--stroke) solid var(--ink); box-shadow: var(--lift);
  font-weight: 800; font-size: 15px; opacity: 0; transition: opacity .3s, transform .3s; max-width: calc(100% - 32px); text-align: center;
}
.hint.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
.hint .hand { width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--coral); border: 2px solid var(--ink); animation: swipe 1.2s ease-in-out infinite; }
.hint.tap .hand { animation: tap 1s ease-in-out infinite; }
.hint.down .hand { animation: swipeDown 1.2s ease-in-out infinite; }
@keyframes swipe { 0%, 100% { transform: translateX(-12px); } 50% { transform: translateX(12px); } }
@keyframes tap { 0%, 100% { transform: scale(1); } 50% { transform: scale(.75); } }
@keyframes swipeDown { 0% { transform: translateY(-8px); opacity: 1; } 80% { transform: translateY(10px); opacity: .4; } 100% { transform: translateY(-8px); opacity: 1; } }
#popups { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.pop {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
  font-family: var(--display); font-size: 18px; color: var(--paper); text-shadow: var(--outline), 0 3px 0 var(--ink);
  animation: pop 1s ease-out forwards;
}
.pop.gold { color: var(--butter); font-size: 22px; }
.pop.mint { color: var(--mint); }
.pop.coral { color: var(--coral); }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -190%) scale(1); } }
#app.capture #hud .hud-tr, #app.capture #hud .hud-power, #app.capture #hud .hud-roll, #app.capture #hud .sub, #app.capture .hint { display: none; }
#app.capture #hud .hud-tl { left: 50%; transform: translateX(-50%); text-align: center; }
#app.capture .score { font-size: 30px; }
.cap-badge {
  position: absolute; right: 12px; bottom: calc(var(--safe-b) + 12px); padding: 4px 9px; border-radius: 8px;
  border: 2px solid var(--ink); background: var(--coral); font-weight: 800; font-size: 11px; letter-spacing: .1em; opacity: .9;
  display: none; align-items: center; gap: 6px; pointer-events: none;
}
.cap-badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
#app.capture .cap-badge { display: inline-flex; }

/* ---------- overlays / sheets ---------- */
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center; padding: calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px);
  background: rgba(47, 42, 85, .28); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  animation: fadeIn .2s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } }
.card {
  position: relative; width: min(100%, 460px); max-height: 100%; overflow: auto; overscroll-behavior: contain; touch-action: pan-y;
  background: var(--cream); border: var(--stroke) solid var(--ink); border-radius: 26px; box-shadow: 0 8px 0 var(--ink);
  padding: 22px 20px 20px; animation: cardIn .35s cubic-bezier(.2, 1.4, .4, 1);
}
@keyframes cardIn { from { transform: translateY(40px) scale(.94); opacity: 0; } }
.card h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.05; letter-spacing: .01em; text-wrap: balance; }
.card .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .7; margin-bottom: 6px; }
.card p { margin: 8px 0 0; line-height: 1.45; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.stack { display: grid; gap: 10px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 auto; }
.sheet .card { width: min(100%, 540px); }
@media (max-width: 600px) {
  .sheet { place-items: end center; padding-bottom: 0; }
  .sheet .card { border-radius: 26px 26px 0 0; max-height: 86%; box-shadow: 0 -4px 0 var(--ink); padding-bottom: calc(var(--safe-b) + 20px); animation: sheetIn .35s cubic-bezier(.2, 1, .3, 1); }
  @keyframes sheetIn { from { transform: translateY(100%); } }
}

.overlay.clear { background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
@media (max-width: 600px) { .sheet.compact .card { max-height: 54%; } }
@media (min-width: 900px) { .overlay.compact { place-items: center end; padding-right: 44px; } }

/* game over */
.over-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.big-score { font-family: var(--display); font-size: clamp(48px, 13vw, 68px); line-height: .95; color: var(--coral); text-shadow: var(--outline), 0 5px 0 var(--ink); margin-top: 6px; font-variant-numeric: tabular-nums; }
.stamp {
  flex: none; transform: rotate(8deg); padding: 6px 10px; border-radius: 10px; border: var(--stroke) solid var(--ink);
  background: var(--butter); font-family: var(--display); font-size: 14px; letter-spacing: .06em; box-shadow: 0 3px 0 var(--ink);
  animation: stamp .5s .3s cubic-bezier(.3, 1.8, .5, 1) both;
}
@keyframes stamp { from { transform: rotate(-20deg) scale(2.4); opacity: 0; } }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0; }
.stat { padding: 8px 6px; border-radius: 14px; border: 2px solid var(--ink); background: var(--paper); text-align: center; }
.stat b { display: block; font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; font-weight: 700; opacity: .75; }
.card-preview {
  display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; margin-bottom: 14px;
  padding: 10px; border-radius: 16px; border: 2px dashed var(--ink-soft);
}
.card-preview img { width: 96px; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 10px; border: 2px solid var(--ink); background: var(--peach); }
.card-preview .row { gap: 8px; }
.card-preview .btn { min-height: 40px; font-size: 13.5px; padding: .4em .8em; }
.note { font-size: 13px; font-weight: 700; opacity: .8; }
.lb-note { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; margin-bottom: 12px; min-height: 20px; }

/* revive */
.revive-ring { width: 120px; height: 120px; margin: 6px auto 12px; position: relative; }
.revive-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.revive-ring circle { fill: none; stroke-width: 10; }
.revive-ring .track { stroke: var(--paper); }
.revive-ring .bar { stroke: var(--coral); stroke-linecap: round; stroke-dasharray: 327; }
.revive-ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 40px; }

/* tabs & lists */
.tabs { display: flex; gap: 6px; padding: 4px; border-radius: 14px; border: 2px solid var(--ink); background: var(--paper); margin-bottom: 12px; }
.tab { flex: 1; border: 0; background: none; padding: 8px; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; }
.tab.on { background: var(--butter); box-shadow: 0 0 0 2px var(--ink); }
.lb { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lb li {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 8px 12px;
  border-radius: 14px; background: var(--paper); border: 2px solid transparent; font-variant-numeric: tabular-nums;
}
.lb li.me { border-color: var(--ink); background: var(--butter); }
.lb .rk { font-family: var(--display); font-size: 16px; text-align: center; }
.lb li:nth-child(1) .rk { color: var(--coral); }
.lb .nm { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.lb .nm i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); flex: none; }
.lb .sc { text-align: right; font-weight: 800; }
.lb .sc small { display: block; font-size: 11px; opacity: .65; font-weight: 700; }
.empty { padding: 18px 12px; text-align: center; font-weight: 700; opacity: .75; border: 2px dashed var(--ink-soft); border-radius: 14px; }
.nick-row { display: flex; gap: 8px; margin-top: 12px; }
.field {
  flex: 1; min-width: 0; min-height: 46px; padding: 0 14px; border-radius: 14px; border: var(--stroke) solid var(--ink);
  background: var(--paper); font-weight: 800; font-size: 16px; color: var(--ink);
}

/* missions */
.mission { padding: 12px 14px; border-radius: 16px; background: var(--paper); border: 2px solid var(--ink); display: grid; gap: 8px; }
.mission.done { background: var(--mint); }
.mission-top { display: flex; justify-content: space-between; gap: 10px; font-weight: 800; }
.reward { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.reward .ic { width: 16px; height: 16px; }
.bar { height: 10px; border-radius: 6px; border: 2px solid var(--ink); background: var(--cream); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--coral); }
.mission.done .bar span { background: var(--ink); }
.mission small { font-weight: 700; opacity: .75; font-variant-numeric: tabular-nums; }

/* hangar */
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.skin {
  text-align: left; padding: 12px; border-radius: 18px; border: var(--stroke) solid var(--ink); background: var(--paper);
  cursor: pointer; display: grid; gap: 6px; box-shadow: 0 3px 0 var(--ink); touch-action: manipulation;
}
.skin.sel { background: var(--butter); }
.skin.locked { background: repeating-linear-gradient(-45deg, var(--paper) 0 8px, var(--cream) 8px 16px); }
.skin .sw { display: flex; gap: 4px; }
.skin .sw i { width: 18px; height: 18px; border-radius: 6px; border: 2px solid var(--ink); }
.skin b { font-size: 15px; font-weight: 800; }
.skin small { font-size: 12px; font-weight: 700; opacity: .8; display: inline-flex; align-items: center; gap: 4px; }
.skin small .ic { width: 14px; height: 14px; }
.skin-desc { font-size: 13px; font-weight: 600; opacity: .85; line-height: 1.35; }

/* log */
.log-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
.log-stats div { padding: 10px 12px; border-radius: 14px; background: var(--paper); border: 2px solid var(--ink); }
.log-stats b { display: block; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.log-stats span { font-size: 12px; font-weight: 700; opacity: .75; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.badge { text-align: center; display: grid; gap: 4px; justify-items: center; font-size: 12px; font-weight: 800; line-height: 1.2; }
.badge .hex {
  width: 58px; height: 64px; display: grid; place-items: center; font-family: var(--display); font-size: 16px;
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--ink);
}
.badge .hex span { width: 52px; height: 58px; display: grid; place-items: center; clip-path: inherit; background: var(--c, var(--butter)); }
.badge.off .hex span { background: var(--cream); color: rgba(47, 42, 85, .35); }
.badge.off { opacity: .7; }
.badge small { font-weight: 600; font-size: 11px; opacity: .75; }
.section-title { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .7; margin: 4px 0 10px; }

/* settings */
.set-list { display: grid; gap: 4px; }
.set { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 2px dashed rgba(47, 42, 85, .2); }
.set:last-child { border-bottom: 0; }
.set label, .set .lbl { font-weight: 800; }
.set .lbl small { display: block; font-weight: 600; font-size: 12px; opacity: .7; margin-top: 2px; }
.toggle {
  flex: none; width: 56px; height: 32px; border-radius: 999px; border: var(--stroke) solid var(--ink); background: var(--paper);
  position: relative; cursor: pointer; padding: 0;
}
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%; background: var(--ink); transition: transform .2s; }
.toggle[aria-checked="true"] { background: var(--mint); }
.toggle[aria-checked="true"]::after { transform: translateX(24px); }
.seg { display: flex; border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; flex: none; }
.seg button { border: 0; background: var(--paper); padding: 7px 11px; font-weight: 800; font-size: 13px; cursor: pointer; }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button.on { background: var(--butter); }
input[type="range"] { width: 130px; accent-color: var(--coral); }

/* pause */
.pause-grid { display: grid; gap: 10px; }

/* photo mode */
#photo { position: absolute; inset: 0; pointer-events: none; }
#photo .ph-top, #photo .ph-bottom { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; padding: 0 16px; pointer-events: auto; flex-wrap: wrap; }
#photo .ph-top { top: calc(var(--safe-t) + 14px); }
#photo .ph-bottom { bottom: calc(var(--safe-b) + 18px); align-items: center; }
.shutter { width: 76px; height: 76px; border-radius: 50%; border: 4px solid var(--ink); background: var(--paper); box-shadow: var(--lift-lg); cursor: pointer; display: grid; place-items: center; }
.shutter::after { content: ""; width: 54px; height: 54px; border-radius: 50%; background: var(--coral); border: 3px solid var(--ink); }
.shutter:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.ph-hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-weight: 800; background: var(--paper); border: 2px solid var(--ink); border-radius: 12px; padding: 8px 14px; animation: fadeOut 2.5s 1s forwards; pointer-events: none; }
@keyframes fadeOut { to { opacity: 0; } }
.frame-guides { position: absolute; inset: 12px; pointer-events: none; border: 2px dashed rgba(47, 42, 85, .25); border-radius: 18px; }

/* toasts */
#toasts { position: absolute; left: 50%; top: calc(var(--safe-t) + 12px); transform: translateX(-50%); display: grid; gap: 8px; width: min(92%, 380px); pointer-events: none; z-index: 30; }
.toast {
  display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 16px; background: var(--paper);
  border: var(--stroke) solid var(--ink); box-shadow: var(--lift); font-weight: 800; font-size: 14px;
  animation: toastIn .4s cubic-bezier(.2, 1.4, .4, 1), toastOut .4s 3.2s ease-in forwards;
}
.toast .hex { width: 34px; height: 38px; flex: none; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--c, var(--butter)); display: grid; place-items: center; font-family: var(--display); font-size: 11px; }
.toast small { display: block; font-weight: 600; font-size: 12px; opacity: .75; }
@keyframes toastIn { from { transform: translateY(-30px); opacity: 0; } }
@keyframes toastOut { to { transform: translateY(-20px); opacity: 0; } }

/* loader */
#loader {
  position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--cream);
  transition: opacity .6s ease, visibility .6s;
}
#loader.done { opacity: 0; visibility: hidden; }
.ld { display: grid; justify-items: center; gap: 18px; }
.ld-sun { width: 150px; height: 76px; position: relative; overflow: hidden; border-bottom: var(--stroke) solid var(--ink); }
.ld-sun::before {
  content: ""; position: absolute; left: 50%; width: 110px; height: 110px; margin-left: -55px; border-radius: 50%;
  background: var(--coral); border: var(--stroke) solid var(--ink); top: calc(100% - var(--p, 0) * 70%);
  box-shadow: inset 0 -16px 0 rgba(255, 224, 122, .7); transition: top .3s ease-out;
}
.ld-name { font-family: var(--display); font-size: 30px; letter-spacing: .04em; }
.ld-msg { font-weight: 700; font-size: 14px; opacity: .8; font-variant-numeric: tabular-nums; }
.noscript-note { padding: 24px; font-weight: 700; }

@media (prefers-reduced-motion: reduce) {
  .logo span, .hint .hand, .hud-roll.ready .ic, .hud-combo em, #fx-speed.on, #fx-fever.on { animation: none !important; }
  .banner.show { animation-duration: 3s; }
}
.reduced .logo span, .reduced .hint .hand, .reduced #fx-speed.on, .reduced #fx-fever.on { animation: none !important; }

/* ============ procedural audio: music that grows with speed + synth sfx ============ */
const Sound = (() => {
  let ctx = null, master, musicBus, sfxBus, delay, noiseBuf;

  const CHORDS = [[53, 57, 60, 64], [50, 53, 57, 60], [46, 50, 53, 57], [48, 52, 55, 57]];
  const ROOTS = [41, 38, 34, 36];
  const PENTA = [77, 79, 81, 84, 86, 89, 91, 93, 96, 98, 101];
  const ARP = [0, 1, 2, 3, 2, 1, 3, 2];

  function init() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ctx = new AC(); } catch (e) { return false; }
    master = ctx.createGain();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;

    const fb = ctx.createGain(); fb.gain.value = 0.33;
    const wet = ctx.createGain(); wet.gain.value = 0.3;

    delay.connect(dlp); dlp.connect(fb); fb.connect(delay); dlp.connect(wet); wet.connect(musicBus);

    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    volumes();
    return true;
  }
  function volumes() {

    const fl = ctx.createBiquadFilter(); fl.type = o.type || 'bandpass';

  const fx = {
    click() { tone({ f: 880, f2: 1100, d: 0.05, g: 0.05 }); },
    shard(k) { const n = PENTA[clamp(k, 0, PENTA.length - 1)]; tone({ f: mtof(n), d: 0.14, g: 0.09 }); tone({ type: 'triangle', f: mtof(n + 12), d: 0.08, g: 0.03 }); },
    graze() { noise({ d: 0.28, g: 0.2, f: 700, f2: 3400, q: 2.5 }); tone({ f: 660, f2: 990, d: 0.12, g: 0.04 }); },
    hop() { tone({ f: 280, f2: 620, d: 0.13, g: 0.12 }); },

    impact() { noise({ d: 0.5, g: 0.25, type: 'lowpass', f: 500, f2: 80 }); tone({ f: 70, f2: 35, d: 0.4, g: 0.2 }); },
    milestone() { tone({ f: mtof(84), d: 0.3, g: 0.07 }); tone({ f: mtof(91), t: ctx.currentTime + 0.12, d: 0.5, g: 0.07 }); },
    zone() { [65, 69, 72, 76].forEach((n, i) => tone({ type: 'triangle', f: mtof(n + 12), t: ctx.currentTime + i * 0.09, d: 0.9, g: 0.035 })); },
    shutter() { noise({ d: 0.06, g: 0.2, type: 'highpass', f: 3000 }); noise({ t: ctx.currentTime + 0.08, d: 0.05, g: 0.12, type: 'highpass', f: 2000 }); },
    buy() { [0, 7, 12].forEach((iv, i) => tone({ f: mtof(79 + iv), t: ctx.currentTime + i * 0.07, d: 0.2, g: 0.07 })); },
    badge() { [0, 4, 7, 12].forEach((iv, i) => tone({ type: 'triangle', f: mtof(76 + iv), t: ctx.currentTime + i * 0.08, d: 0.35, g: 0.05 })); },
  };

  return {
    unlock, volumes, suspend,
    setIntensity(v) { target = clamp(v, 0, 1); },
    setFever(v) { fever = v; },
    play(name, arg) { if (!ctx || ctx.state !== 'running' || S.settings.muted) return; try { fx[name](arg); } catch (e) { /* ignore */ } },
  };
})();

/* ============ world: renderer, curved-horizon shader, sky, terrain, decor, zones ============ */
const TRACK = 7.0;          // half-width of the flyable road
const AHEAD = 175;          // how far ahead the world is built
const DAY_M = 3000;         // one Nectar day, in metres

const BEND = { uBendY: { value: 0.0019 }, uBendX: { value: 0 } };

const BEND_VERT = `
  vec4 mvPosition = vec4( transformed, 1.0 );
  #ifdef USE_INSTANCING
    mvPosition = instanceMatrix * mvPosition;
  #endif
  mvPosition = modelViewMatrix * mvPosition;
  float bz = min( mvPosition.z + 2.0, 0.0 );
  mvPosition.y -= bz * bz * uBendY;
  mvPosition.x += bz * bz * uBendX;
  gl_Position = projectionMatrix * mvPosition;`;

function bendify(mat, tag) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uBendY = BEND.uBendY; sh.uniforms.uBendX = BEND.uBendX;
    sh.vertexShader = 'uniform float uBendY;\nuniform float uBendX;\n' + sh.vertexShader.replace('#include <project_vertex>', BEND_VERT);
  };
  mat.customProgramCacheKey = () => 'bend-' + (tag || mat.type);
  return mat;
}
const lam = (hex, opts) => bendify(new THREE.MeshLambertMaterial(Object.assign({ color: hex }, opts || {})), 'lam' + (opts && opts.transparent ? 't' : ''));
const basic = (hex, opts) => bendify(new THREE.MeshBasicMaterial(Object.assign({ color: hex }, opts || {})), 'bas' + (opts && opts.transparent ? 't' : '') + (opts && opts.vertexColors ? 'v' : ''));

/* ---- sky dome, stars, gas giant with rings ---- */
function buildSky() {
  const skyGeo = new THREE.SphereGeometry(900, 32, 16);
  W.skyU = { top: { value: new THREE.Color() }, hor: { value: new THREE.Color() }, sunCol: { value: new THREE.Color() }, sunDir: { value: new THREE.Vector3(0, 0.2, -1) }, night: { value: 0 } };

    uniforms: W.skyU, side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: 'varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform vec3 top; uniform vec3 hor; uniform vec3 sunCol; uniform vec3 sunDir; uniform float night; varying vec3 vDir;
      void main(){ vec3 d = normalize(vDir); float h = clamp(d.y * 1.5 + 0.02, 0.0, 1.0);
        vec3 c = mix(hor, top, pow(h, 0.62));
        float s = max(dot(d, normalize(sunDir)), 0.0);
        c += sunCol * (smoothstep(0.9975, 0.9985, s) * 0.9 + pow(s, 28.0) * 0.28 + pow(s, 4.0) * 0.08);
        c = mix(c, hor, smoothstep(0.08, -0.05, d.y));

  // stars

  for (let i = 0; i < N; i++) {
    const th = r() * TAU, y = r() * 0.9 + 0.05, rr = Math.sqrt(1 - y * y);
    pos[i * 3] = Math.cos(th) * rr * 800; pos[i * 3 + 1] = y * 800; pos[i * 3 + 2] = Math.sin(th) * rr * 800;

    vertexShader: 'attribute float tw; uniform float time; uniform float pr; varying float vA; void main(){ vA = 0.55 + 0.45 * sin(time * 2.0 + tw); gl_PointSize = (1.6 + fract(tw) * 2.2) * pr; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',

    vertexShader: 'varying vec3 vN; varying vec3 vP; void main(){ vN = normalize(normalMatrix * normal); vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',

/* ---- terrain: recycled chunks, heights from continuous noise ---- */
const XS = [-68, -52, -41, -33, -26.5, -21.5, -17.5, -14.2, -11.6, -9.6, -8.1, -5.4, -2.7, 0, 2.7, 5.4, 8.1, 9.6, 11.6, 14.2, 17.5, 21.5, 26.5, 33, 41, 52, 68];
const CH_L = 24, CH_NZ = 6, CH_N = 10;
function terrainH(x, d) {
  const ax = Math.abs(x);
  const e = smooth(TRACK + 1.0, TRACK + 8.5, ax);
  const n1 = noise2(x * 0.045 + 100, d * 0.028), n2 = noise2(x * 0.14 + 40, d * 0.1);
  let h = e * (0.8 + n1 * 7.8 + n2 * 2.6 + smooth(26, 60, ax) * (4 + n1 * 8));
  h += (1 - e) * (noise2(x * 0.35, d * 0.22) - 0.5) * 0.16;
  return h;
}
function buildTerrain() {
  const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  W.terrU = { uGA: { value: new THREE.Color() }, uGB: { value: new THREE.Color() }, uTrack: { value: new THREE.Color() } };
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, W.terrU, BEND);
    sh.vertexShader = 'uniform float uBendY;\nuniform float uBendX;\nattribute vec2 aT;\nvarying vec2 vT;\n' +
      sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n vT = aT;').replace('#include <project_vertex>', BEND_VERT);
    sh.fragmentShader = 'uniform vec3 uGA;\nuniform vec3 uGB;\nuniform vec3 uTrack;\nvarying vec2 vT;\n' +
      sh.fragmentShader.replace('vec4 diffuseColor = vec4( diffuse, opacity );', 'vec4 diffuseColor = vec4( vT.y > 0.01 ? uTrack * vT.y : mix( uGA, uGB, vT.x ), opacity );');
  };
  mat.customProgramCacheKey = () => 'terrain';
  W.terrMat = mat;
  const nx = XS.length - 1, tris = nx * CH_NZ * 2;
  for (let i = 0; i < CH_N; i++) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(tris * 9), 3));
    g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(tris * 9), 3));
    g.setAttribute('aT', new THREE.BufferAttribute(new Float32Array(tris * 6), 2));
    const m = new THREE.Mesh(g, mat);
    m.frustumCulled = false;
    W.scene.add(m);
    W.chunks.push({ mesh: m, d0: -1e9 });
  }
}
function fillChunk(ch, d0) {
  ch.d0 = d0;
  const g = ch.mesh.geometry, P = g.attributes.position.array, T = g.attributes.aT.array;
  const nx = XS.length - 1, dz = CH_L / CH_NZ;
  const vx = (xi, d) => { const x = XS[xi]; const j = Math.abs(x) > TRACK + 3 && Math.abs(x) < 66 ? (hash2(xi * 7, Math.round(d * 10)) - 0.5) * 2.2 : 0; return x + j; };
  let p = 0, q = 0;
  for (let zi = 0; zi < CH_NZ; zi++) {
    const da = d0 + zi * dz, db = da + dz;
    for (let xi = 0; xi < nx; xi++) {
      const x00 = vx(xi, da), x10 = vx(xi + 1, da), x01 = vx(xi, db), x11 = vx(xi + 1, db);
      const h00 = terrainH(x00, da), h10 = terrainH(x10, da), h01 = terrainH(x01, db), h11 = terrainH(x11, db);
      const onTrack = Math.abs(XS[xi]) <= TRACK + 1.2 && Math.abs(XS[xi + 1]) <= TRACK + 1.2;
      const stripe = Math.floor(da / 8) % 2;
      const quad = [[x00, h00, da, x01, h01, db, x10, h10, da], [x10, h10, da, x01, h01, db, x11, h11, db]];
      for (let k = 0; k < 2; k++) {
        const v = quad[k];
        for (let s = 0; s < 9; s += 3) { P[p++] = v[s]; P[p++] = v[s + 1]; P[p++] = -v[s + 2]; }
        const hAvg = (v[1] + v[4] + v[7]) / 3;
        const tone = clamp(hAvg / 10 + (hash2(xi * 3 + k, Math.round(da * 3)) - 0.5) * 0.16, 0, 1);
        for (let s = 0; s < 3; s++) { T[q++] = tone; T[q++] = onTrack ? (stripe ? 0.955 : 1.0) : 0; }
      }
    }
  }
  g.attributes.position.needsUpdate = true;
  g.attributes.aT.needsUpdate = true;
  g.computeVertexNormals();
}
function resetTerrain(dist) {
  const start = Math.floor((dist - 38) / CH_L) * CH_L;
  W.chunks.forEach((ch, i) => fillChunk(ch, start + i * CH_L));
}
function updateTerrain(dist) {
  // recycle the chunk that has fallen behind the camera
  for (const ch of W.chunks) {
    if (ch.d0 + CH_L < dist - 38) {
      let maxD = -1e9;
      for (const c of W.chunks) maxD = Math.max(maxD, c.d0);
      fillChunk(ch, maxD + CH_L);
      break; // one per frame keeps the frame time flat
    }
  }
}

/* ---- decor: instanced crystals, boulders, puff trees, beacons, clouds ---- */
function makeInst(geo, mat, n) {
  const m = new THREE.InstancedMesh(geo, mat, n);
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  m.frustumCulled = false;
  const hidden = new THREE.Matrix4().makeScale(0, 0, 0);
  const c = new THREE.Color(1, 1, 1);
  for (let i = 0; i < n; i++) { m.setMatrixAt(i, hidden); m.setColorAt(i, c); }
  m.userData = { n, next: 0 };
  W.scene.add(m);
  return m;
}
function buildDecor() {
  W.mats.decor = lam(0xb9a8f5);
  W.mats.decorRock = lam(0xe3928a);
  W.mats.stem = lam(0xfff3e2);
  W.mats.tree = lam(0xff9e8f);
  W.mats.beacon = basic(0xfff4e0);
  W.mats.cloud = lam(0xfff1e6, { emissive: 0x6b5a60 });
  const cr = new THREE.OctahedronGeometry(1, 0); cr.scale(0.55, 2.1, 0.55);
  W.inst.crystal = makeInst(cr, W.mats.decor, 40);
  W.inst.rock = makeInst(new THREE.DodecahedronGeometry(1, 0), W.mats.decorRock, 30);
  const stem = new THREE.CylinderGeometry(0.16, 0.28, 1.8, 5); stem.translate(0, 0.9, 0);
  W.inst.stem = makeInst(stem.toNonIndexed(), W.mats.stem, 24);
  const cap = new THREE.IcosahedronGeometry(1, 0); cap.scale(1.2, 0.8, 1.2); cap.translate(0, 2.1, 0);
  W.inst.cap = makeInst(cap, W.mats.tree, 24);
  W.inst.beacon = makeInst(new THREE.OctahedronGeometry(0.2, 0), W.mats.beacon, 44);
  const cl = new THREE.IcosahedronGeometry(1, 1); cl.scale(1, 0.55, 0.8);
  W.inst.cloud = makeInst(cl, W.mats.cloud, 36);
  W.tmpM = new THREE.Matrix4(); W.tmpQ = new THREE.Quaternion(); W.tmpE = new THREE.Euler(); W.tmpV = new THREE.Vector3(); W.tmpS = new THREE.Vector3(); W.tmpC = new THREE.Color();
}
function placeInst(im, x, y, z, rx, ry, rz, sx, sy, sz, tint) {

function E_spire(d, x, s = 1) { const m = pooled('spire', MK.spire); m.position.set(x, 0, -d); m.scale.setScalar(s * 0.85); m.rotation.y = hash2(d * 10, x * 10) * 3; return addEnt({ t: 'spire', d, x, r: 0.95 * s * 0.85, h: 99, mesh: m }); }

function E_post(d, x) { const m = pooled('post', MK.post); m.position.set(x, 0, -d); return addEnt({ t: 'post', d, x, r: 0.5, h: 99, mesh: m }); }
function E_boulder(d, x0, amp, k, ph) { const m = pooled('boulder', MK.boulder); m.position.set(x0, 1.15, -d); const sh = pooled('shadow', MK.shadow); sh.position.set(x0, 0.04, -d); sh.scale.setScalar(1.2); return addEnt({ t: 'boulder', d, x: x0, x0, amp, k, ph, r: 1.1, h: 99, mesh: m, extra: [sh] }); }
function E_ridge(d, x1 = -TRACK - 1, x2 = TRACK + 1) { const m = pooled('ridge', MK.ridge); const w = x2 - x1; m.position.set((x1 + x2) / 2, 0, -d); m.scale.set(w, 1, 1); return addEnt({ t: 'ridge', d, x1, x2, h: 0.95, mesh: m }); }

/* ---------- spawner: deterministic patterns keyed on distance ---------- */
const PATTERNS = {
  spires(d, r, k) {
    const n = r.int(2, 3 + Math.round(k * 2));
    let len = 0;
    for (let i = 0; i < n; i++) {
      const dd = d + i * r.range(9, 15) * (1.15 - k * 0.3); len = dd - d;
      E_spire(dd, r.range(-TRACK + 1, TRACK - 1), r.range(0.9, 1.25));
    }
    for (let i = 0; i < 5; i++) E_shard(d + len / 2 - 8 + i * 4, Math.sin(i * 0.9 + r() * 3) * 3.5);
    return len + 6;
  },
  gate(d, r, k) {
    const gw = lerp(4.8, 3.2, k), gx = r.range(-TRACK + gw / 2 + 0.6, TRACK - gw / 2 - 0.6);
    E_gate(d + 4, gx, gw);
    for (let i = 0; i < 4; i++) E_shard(d - 4 + i * 3, lerp(0, gx, i / 3));
    return 8;
  },
  ridge(d, r) {
    E_ridge(d + 6);
    for (let i = 0; i < 5; i++) { const u = i / 4; E_shard(d + 6 - 4.4 + u * 8.8, r.range(-0.4, 0.4), 1.0 + Math.sin(u * Math.PI) * 1.35); }
    return 12;
  },
  doubleRidge(d, r) {
    E_ridge(d + 4); E_ridge(d + 4 + r.range(16, 20));
    E_shard(d + 14, r.range(-4, 4)); E_shard(d + 15.5, r.range(-4, 4));
    return 26;
  },
  slalom(d, r, k) {
    const n = 4 + Math.round(k * 3), s = r.sign();
    for (let i = 0; i < n; i++) {
      const side = (i % 2 ? 1 : -1) * s;
      E_post(d + i * lerp(11, 8, k), side * r.range(1.2, 3.2));
      E_shard(d + i * lerp(11, 8, k) + 4, -side * 3.5);
    }
    return n * lerp(11, 8, k);
  },
  boulders(d, r, k) {
    const n = k > 0.4 ? 2 : 1;
    for (let i = 0; i < n; i++) E_boulder(d + i * 16, r.range(-3, 3), r.range(3, 5.5), r.range(0.1, 0.18), r() * TAU);
    for (let i = 0; i < 3; i++) E_shard(d + 8 + i * 3, r.range(-5, 5));
    return n * 16;
  },
  rings(d, r) {
    const n = r.int(3, 5), a = r.range(-3, 3), ph = r() * TAU;
    for (let i = 0; i < n; i++) E_ring(d + i * 13, clamp(a + Math.sin(ph + i * 0.9) * 3.8, -TRACK + 1.5, TRACK - 1.5));
    return n * 13;
  },
  field(d, r, k) {
    // a crystal field with a winding safe lane
    const len = 44 + k * 20; let lane = r.range(-3, 3);
    for (let dd = 0; dd < len; dd += 7) {
      lane = clamp(lane + r.range(-2.2, 2.2), -TRACK + 2.2, TRACK - 2.2);
      for (let x = -TRACK + 0.8; x <= TRACK - 0.8; x += r.range(2.4, 3.4)) {
        if (Math.abs(x - lane) > 2.3) E_spire(d + dd + r.range(-1, 1), x, r.range(0.55, 0.8));
      }
      E_shard(d + dd + 3.5, lane);
    }
    return len;
  },
  gateRidge(d, r, k) {
    PATTERNS.gate(d, r, k); E_ridge(d + 18);
    return 22;
  },
  shardSnake(d, r) {
    const a = r.range(-2, 2), ph = r() * TAU;
    for (let i = 0; i < 10; i++) E_shard(d + i * 3.2, clamp(a + Math.sin(ph + i * 0.45) * 4.5, -TRACK + 0.8, TRACK - 0.8));
    E_spire(d + 16, r.sign() * (TRACK - 0.8), 1);
    return 32;
  },
};
const PAT_TABLE = [
  // [name, weight at start, weight at max difficulty, unlock distance]
  ['spires', 3, 2, 0], ['gate', 2, 3, 150], ['ridge', 2, 2, 250], ['slalom', 2, 2, 350], ['rings', 1.5, 1.2, 200],
  ['shardSnake', 1.5, 0.6, 0], ['boulders', 0, 2, 900], ['field', 0, 2, 1200], ['doubleRidge', 0, 1.5, 700], ['gateRidge', 0, 2, 1600],
];
function pickPattern(r, d) {
  const k = clamp(d / 6000, 0, 1);
  const opts = PAT_TABLE.filter((p) => d >= p[3]).map((p) => [p[0], lerp(p[1], p[2], k)]);
  let total = opts.reduce((s, o) => s + o[1], 0), x = r() * total;
  for (const o of opts) { x -= o[1]; if (x <= 0) return o[0]; }
  return opts[0][0];
}

const TUTORIAL_SCRIPT = [
  [70, (d) => { for (let i = 0; i < 6; i++) E_shard(d + i * 3.5, Math.sin(i * 0.8) * 3); return 22; }],
  [140, (d) => { E_spire(d, -3.2); E_spire(d + 14, 3.2); for (let i = 0; i < 4; i++) E_shard(d + 6 + i * 2, 0); return 20; }],
  [240, (d) => { for (let i = 0; i < 5; i++) E_shard(d + i * 3, 3 - i * 1.5); return 15; }],
  [320, (d, r) => PATTERNS.ridge(d, r)],
  [400, (d) => { E_ridge(d); E_shard(d, 0, 2.2); return 8; }],
  [470, (d) => { E_gate(d, 0, 4.8); E_shard(d, 0); return 10; }],
  [560, (d, r) => PATTERNS.rings(d, r)],
];

const Spawner = {
  next: 0, rng: null, powerNext: 0, showerNext: 0, archNext: 1000, tutorialIdx: 0, flagDone: false,
  reset(seed, tutorial) {
    this.rng = mulberry(seed);
    this.prng = mulberry(seed ^ 0x9e3779b9);
    this.next = tutorial ? 70 : 60;
    this.tutorial = tutorial;
    this.tutorialIdx = 0;
    this.powerNext = 420 + this.prng() * 200;
    this.showerNext = 1500 + this.prng() * 300;
    this.archNext = 1000;
    this.flagDone = false;
    this.inShower = 0;
  },
  update(dist) {
    const lim = dist + AHEAD - 10;
    while (this.next < lim) {
      const d = this.next;
      if (this.tutorial && d < 640) {
        const step = TUTORIAL_SCRIPT[this.tutorialIdx];
        if (step && d >= step[0] - 1) { const len = step[1](Math.max(d, step[0]), this.rng); this.tutorialIdx++; this.next = Math.max(d, step[0]) + len + 20; }
        else this.next = step ? step[0] : 640;
        continue;
      }
      const k = clamp(d / 6000, 0, 1);
      if (d >= this.powerNext) {
        const kinds = ['magnet', 'shield', 'comet'];
        E_power(d + 4, this.prng.range(-4.5, 4.5), kinds[Math.floor(this.prng() * 3)]);
        this.powerNext += 620 + this.prng() * 260;
        this.next = d + 18;
        continue;
      }
      if (d >= this.showerNext) {
        const n = 9 + Math.round(k * 6);
        for (let i = 0; i < n; i++) E_meteor(d + 30 + i * (240 / n) + this.prng.range(-6, 6), this.prng.range(-TRACK + 1, TRACK - 1));
        addEnt({ t: 'showerStart', d: d + 10 });
        addEnt({ t: 'showerEnd', d: d + 290 });
        this.showerNext += 1300 + this.prng() * 300;
        this.next = d + 30;
        this.inShower = d + 290;
        continue;
      }
      const name = pickPattern(this.rng, d);
      const len = PATTERNS[name](d, this.rng, k);
      const gap = lerp(34, 17, k) + this.rng() * 10 + (d < this.inShower ? 22 : 0);
      this.next = d + len + gap;
    }
    while (this.archNext < lim) { E_arch(this.archNext, this.archNext); this.archNext += 1000; }
    if (!this.flagDone && G.bestDistForFlag > 200 && G.bestDistForFlag < lim) { E_flag(G.bestDistForFlag, fmt(G.bestDistForFlag) + ' m'); this.flagDone = true; }
  },
};

/* ---- 05-fx.js ---- */
/* ============ effects: particles, debris, screen popups ============ */
const FX = {
  N: 600, i: 0,
  init() {
    const N = this.N;
    this.pos = new Float32Array(N * 3); this.col = new Float32Array(N * 3); this.alpha = new Float32Array(N); this.size = new Float32Array(N);
    this.vel = new Float32Array(N * 3); this.life = new Float32Array(N); this.max = new Float32Array(N); this.grav = new Float32Array(N); this.drag = new Float32Array(N); this.s0 = new Float32Array(N);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    g.setAttribute('pcol', new THREE.BufferAttribute(this.col, 3));
    g.setAttribute('alpha', new THREE.BufferAttribute(this.alpha, 1));
    g.setAttribute('psize', new THREE.BufferAttribute(this.size, 1));
    this.u = { pr: { value: 1 } };
    const mat = new THREE.ShaderMaterial({
      uniforms: Object.assign(this.u, BEND), transparent: true, depthWrite: false,
      vertexShader: `attribute vec3 pcol; attribute float alpha; attribute float psize; uniform float uBendY; uniform float uBendX; uniform float pr; varying vec3 vC; varying float vA;
        void main(){ vC = pcol; vA = alpha; vec4 mv = modelViewMatrix * vec4(position, 1.0); float bz = min(mv.z + 2.0, 0.0); mv.y -= bz * bz * uBendY; mv.x += bz * bz * uBendX;
          gl_PointSize = psize * pr * (240.0 / max(-mv.z, 0.5)); gl_Position = projectionMatrix * mv; }`,
      fragmentShader: 'varying vec3 vC; varying float vA; void main(){ vec2 p = gl_PointCoord - 0.5; float d = length(p); if (d > 0.5) discard; float a = smoothstep(0.5, 0.18, d); gl_FragColor = vec4(mix(vC, vec3(1.0), smoothstep(0.25, 0.0, d) * 0.5), a * vA); }',
    });
    this.points = new THREE.Points(g, mat); this.points.frustumCulled = false; this.points.renderOrder = 5;
    W.scene.add(this.points);
    this.c = new THREE.Color();
    // debris for the crash
    this.debris = [];
    const dg = new THREE.TetrahedronGeometry(0.28, 0);
    for (let i = 0; i < 18; i++) {
      const m = new THREE.Mesh(dg, lam(0xffffff)); m.visible = false; m.frustumCulled = false;
      W.scene.add(m); this.debris.push({ m, v: new THREE.Vector3(), w: new THREE.Vector3(), life: 0 });
    }
  },
  emit(x, y, z, o) {
    const n = o.n || 8, col = this.c.set(o.color || '#ffffff');
    for (let k = 0; k < n; k++) {
      const i = this.i; this.i = (this.i + 1) % this.N;
      const sp = (o.speed || 4) * (0.4 + Math.random() * 0.6), th = Math.random() * TAU, ph = (o.flat ? 0.08 : 1) * (Math.random() - 0.35) * Math.PI;
      this.pos[i * 3] = x + (Math.random() - 0.5) * (o.jitter || 0.3);
      this.pos[i * 3 + 1] = y + (Math.random() - 0.5) * (o.jitter || 0.3);
      this.pos[i * 3 + 2] = z + (Math.random() - 0.5) * (o.jitter || 0.3);
      this.vel[i * 3] = Math.cos(th) * Math.cos(ph) * sp + (o.vx || 0);
      this.vel[i * 3 + 1] = Math.sin(ph) * sp + (o.vy || 0);
      this.vel[i * 3 + 2] = Math.sin(th) * Math.cos(ph) * sp + (o.vz || 0);
      const cc = o.colors ? this.c.set(o.colors[k % o.colors.length]) : col;
      this.col[i * 3] = cc.r; this.col[i * 3 + 1] = cc.g; this.col[i * 3 + 2] = cc.b;
      this.max[i] = this.life[i] = (o.life || 0.7) * (0.6 + Math.random() * 0.6);
      this.grav[i] = o.grav != null ? o.grav : -6; this.drag[i] = o.drag || 1.5;
      this.s0[i] = (o.size || 0.5) * (0.6 + Math.random() * 0.7);
    }
  },
  crash(x, y, z, skin) {
    const cols = [skin.body, skin.wing, skin.accent, '#2F2A55'];
    this.debris.forEach((p, i) => {
      p.m.visible = true; p.life = 2.2;
      p.m.material.color.set(cols[i % cols.length]);
      p.m.position.set(x + (Math.random() - 0.5), y + Math.random() * 0.4, z + (Math.random() - 0.5));
      p.v.set((Math.random() - 0.5) * 12, 4 + Math.random() * 7, -4 - Math.random() * 10);
      p.w.set(Math.random() * 10, Math.random() * 10, Math.random() * 10);
      p.m.scale.setScalar(0.6 + Math.random() * 1.2);
    });
    this.emit(x, y, z, { n: 40, colors: ['#FFF3E2', '#FFE07A', '#FF7A6B', '#B9A8F5'], speed: 9, life: 1.1, size: 0.8, grav: -5 });
  },
  update(dt) {
    const N = this.N;
    for (let i = 0; i < N; i++) {
      if (this.life[i] <= 0) { this.alpha[i] = 0; continue; }
      this.life[i] -= dt;
      const k = Math.exp(-this.drag[i] * dt);
      this.vel[i * 3] *= k; this.vel[i * 3 + 1] = this.vel[i * 3 + 1] * k + this.grav[i] * dt; this.vel[i * 3 + 2] *= k;
      this.pos[i * 3] += this.vel[i * 3] * dt; this.pos[i * 3 + 1] += this.vel[i * 3 + 1] * dt; this.pos[i * 3 + 2] += this.vel[i * 3 + 2] * dt;
      if (this.pos[i * 3 + 1] < 0.05) { this.pos[i * 3 + 1] = 0.05; this.vel[i * 3 + 1] *= -0.3; }
      const u = clamp(this.life[i] / this.max[i], 0, 1);
      this.alpha[i] = u < 0.3 ? u / 0.3 : 1;
      this.size[i] = this.s0[i] * (0.4 + u * 0.6);
    }
    const g = this.points.geometry.attributes;
    g.position.needsUpdate = true; g.alpha.needsUpdate = true; g.psize.needsUpdate = true; g.pcol.needsUpdate = true;
    for (const p of this.debris) {
      if (p.life <= 0) continue;
      p.life -= dt;
      p.v.y -= 18 * dt;
      p.m.position.addScaledVector(p.v, dt);
      if (p.m.position.y < 0.15) { p.m.position.y = 0.15; p.v.y *= -0.35; p.v.x *= 0.7; p.v.z *= 0.7; }
      p.m.rotation.x += p.w.x * dt; p.m.rotation.y += p.w.y * dt; p.m.rotation.z += p.w.z * dt;
      if (p.life <= 0) p.m.visible = false;
    }
  },
  clear() { this.life.fill(0); this.alpha.fill(0); this.debris.forEach((p) => { p.life = 0; p.m.visible = false; }); },
};

/* project a world point with the same bend the shaders use */
const _pv = new THREE.Vector3();
function toScreen(x, y, z) {
  const cam = W.camera, el = W.renderer.domElement;
  _pv.set(x, y, z).applyMatrix4(cam.matrixWorldInverse);
  const bz = Math.min(_pv.z + 2, 0);
  _pv.y -= bz * bz * BEND.uBendY.value; _pv.x += bz * bz * BEND.uBendX.value;
  _pv.applyMatrix4(cam.projectionMatrix);
  return { x: (_pv.x * 0.5 + 0.5) * el.clientWidth, y: (-_pv.y * 0.5 + 0.5) * el.clientHeight };
}
function popup(text, x, y, z, cls) {
  const host = $('#popups'); if (!host || host.childElementCount > 12) return;
  const p = toScreen(x, y, z);
  const el = document.createElement('div');
  el.className = 'pop ' + (cls || '');
  el.textContent = text;
  el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
  host.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

const MISSION_POOL = [
  { id: 'shards', goals: [60, 90, 130], stat: 'shards', reward: 60, en: 'Collect {n} shards', ru: 'Собрать осколки: {n}' },

];
function ensureMissions() {
  const day = dayKey();
  if (S.missions.day === day && S.missions.list.length) return;
  const r = mulberry(hashStr('missions-' + day));
  const pool = MISSION_POOL.slice(), list = [];
  while (list.length < 3) {
    const m = pool.splice(Math.floor(r() * pool.length), 1)[0];
    const tier = Math.floor(r() * 3);
    list.push({ id: m.id, goal: m.goals[tier], reward: m.reward + tier * 20, p: 0, done: false });
  }
  S.missions = { day, list };
  save();
}
function missionText(m) { const def = MISSION_POOL.find((x) => x.id === m.id); return (LANG === 'ru' ? def.ru : def.en).replace('{n}', fmt(m.goal)); }
function applyMissions(run) {
  ensureMissions();
  const out = [];
  for (const m of S.missions.list) {
    if (m.done) continue;
    const def = MISSION_POOL.find((x) => x.id === m.id);
    const v = def.stat === 'dailyRuns' ? (run.mode === 'daily' ? 1 : 0) : run[def.stat] || 0;
    m.p = def.single ? Math.max(m.p, v) : m.p + v;
    if (m.p >= m.goal) { m.p = m.goal; m.done = true; S.wallet += m.reward; out.push(m); }
  }
  save();
  return out;
}

function comboAdd(n) {
  G.combo += n; G.comboT = 4;
  const m = Math.min(5, 1 + Math.floor(G.combo / 4));
  if (m > G.mult) { G.mult = m; UI.multBump(); }
  G.bestMult = Math.max(G.bestMult, G.mult);

}
function startFever() {

}
function addBonus(v) { G.bonus += Math.round(v * G.mult * (G.fever > 0 ? 2 : 1)); UI.scoreBump(); }

function doHop() {
  if (G.state !== 'play' || G.ship.air) return;

}

  const dir = (INPUT.right ? 1 : 0) - (INPUT.left ? 1 : 0) || Math.sign(s.vx) || Math.sign(s.tx - s.x) || (s.x > 0 ? -1 : 1);
  s.roll = 0.5; s.rollDir = dir; s.rollCd = 2.2; G.rolls++;

}

function smash(e, idx) {

  const x = e.t === 'ridge' || e.t === 'gate' ? G.ship.x : e.x;

function removeEnt(i) {

function endRun() {

  run.day = G.day; run.skin = S.skin;
  const st = S.stats;
  st.runs++; st.dist += run.dist; st.shards += run.shards; st.grazes += run.grazes; st.perfects += run.perfects; st.rings += run.rings;
  st.showers += run.showers; st.fevers += run.fevers; st.time += G.runT;
  st.bestCombo = Math.max(st.bestCombo, run.mult);
  let isBest = false;
  if (run.score > st.bestScore) st.bestScore = run.score;
  if (run.dist > st.bestDist) st.bestDist = run.dist;
  if (G.mode === 'daily') {
    if (!st.dailyDays.includes(G.day)) st.dailyDays.push(G.day);
    if (st.dailyDays.length > 60) st.dailyDays = st.dailyDays.slice(-60);
    if (run.score > S.daily.score) {
      isBest = S.daily.score > 0;
      S.daily.score = run.score; S.daily.dist = run.dist; S.daily.ghost = G.ghostRec.slice();
    }
  } else if (run.score > S.bestFree.score) { isBest = S.bestFree.score > 0; S.bestFree = { score: run.score, dist: run.dist }; }

/* ---------- main update ---------- */
function update(dt) {
  G.menuT += dt;
  pollGamepad();
  if (G.state === 'menu' || G.state === 'boot') { updateMenu(dt); return; }
  if (G.state === 'paused' || G.state === 'photo') { return; }
  if (G.state === 'crash' || G.state === 'revive' || G.state === 'over') { updateAfterCrash(dt); return; }
  if (G.state !== 'play') return;

  // time scale for slow-mo moments
  if (G.slow > 0) { G.slow -= dt; G.ts = damp(G.ts, 0.42, 18, dt); } else G.ts = damp(G.ts, 1, 6, dt);
  const gdt = dt * G.ts;
  G.runT += gdt;
  const s = G.ship;

  // speed ramps up over a couple of minutes
  let target = 21 + 26 * (1 - Math.exp(-G.runT / 95));
  if (G.tutorial && G.dist < 640) target = Math.min(target, 20);
  if (G.comet > 0) target *= 1.55;
  G.speed = damp(G.speed, target, 2.2, gdt);
  G.prev = G.dist;
  G.dist += G.speed * gdt;

  // steering
  const sens = S.settings.sens;
  const dir = clamp((INPUT.right ? 1 : 0) - (INPUT.left ? 1 : 0) + INPUT.gpX, -1, 1);
  const px = s.x;
  if (INPUT.ptr) {
    s.x = damp(s.x, s.tx, 16, gdt);
    s.vx = (s.x - px) / Math.max(gdt, 1e-4);
  } else {
    s.vx = dir !== 0 ? damp(s.vx, dir * 15.5 * sens, 11, gdt) : damp(s.vx, 0, 9, gdt);
    s.x += s.vx * gdt; s.tx = s.x;
  }
  if (s.roll > 0) { s.x += s.rollDir * 8.5 * gdt; s.tx = s.x; s.roll -= gdt; }
  s.x = clamp(s.x, -TRACK + 0.55, TRACK - 0.55);
  s.tx = clamp(s.tx, -TRACK + 0.55, TRACK - 0.55);
  const lat = (s.x - px) / Math.max(gdt, 1e-4);
  s.bank = damp(s.bank, clamp(-lat * 0.045, -0.75, 0.75), 10, dt);
  s.rollCd = Math.max(0, s.rollCd - gdt);
  s.inv = Math.max(0, s.inv - gdt);
  s.squash = damp(s.squash, 0, 8, dt);

  // hop physics
  if (s.air) {
    s.vy -= 30 * gdt; s.y += s.vy * gdt;
    if (s.y <= 0) {
      s.y = 0; s.vy = 0; s.air = false; s.squash = 0.35;
      Sound.play('land');
      FX.emit(s.x, 0.2, -G.dist + 0.6, { n: 12, color: '#' + W.pal.track.getHexString(), speed: 3.5, life: 0.6, size: 0.7, grav: 1, flat: true, drag: 3 });
    }
  }

  // combo / fever / power-ups
  if (G.fever > 0) {
    G.fever -= gdt;
    if (G.fever <= 0) { G.combo = 0; G.mult = 1; G.comboT = 0; Sound.setFever(false); }
  } else if (G.comboT > 0) {
    G.comboT -= gdt;
    if (G.comboT <= 0) { G.combo = 0; G.mult = 1; }
  }
  G.feverMix = damp(G.feverMix, G.fever > 0 ? 1 : 0, 3, dt);
  if (G.magnet > 0) G.magnet -= gdt;
  if (G.comet > 0) { G.comet -= gdt; if (G.comet <= 0) s.inv = Math.max(s.inv, 0.8); }

  // world streaming
  Spawner.update(G.dist);
  updateDecor(G.dist);
  updateTerrain(G.dist);
  updateEntities(dt, gdt);
  if (G.state !== 'play') return;

  // ghost of today's best run
  if (G.ghost && !G.ghostDone) {
    const f = G.dist / 2, i = Math.floor(f), n = G.ghost.length / 2;
    if (i + 1 < n) {
      const u = f - i, gx = lerp(G.ghost[i * 2], G.ghost[i * 2 + 2], u), gy = lerp(G.ghost[i * 2 + 1], G.ghost[i * 2 + 3], u);
      const gg = Ship.ghost.grp; gg.visible = true;
      gg.position.set(gx, BASE_Y + 0.1 + gy, -G.dist - 1.4);
      gg.rotation.set(0, 0, clamp(-(gx - (gg.userData.px || gx)) / Math.max(gdt, 1e-3) * 0.04, -0.6, 0.6));
      gg.userData.px = gx;
    } else {
      G.ghostDone = true;
      const gg = Ship.ghost.grp; gg.visible = false;
      FX.emit(gg.position.x, gg.position.y, gg.position.z, { n: 20, color: '#FFFFFF', speed: 5, life: 0.8, size: 0.6 });
    }
  }
  // record this run for a future ghost
  while (G.ghostRec.length / 2 <= G.dist / 2) G.ghostRec.push(Math.round(s.x * 100) / 100, Math.round(s.y * 100) / 100);

  G.score = Math.floor(G.dist) + G.bonus;

  // zone banners
  const zi = Math.floor(G.dist / ZONE_M);
  if (zi > G.zoneShown) {
    G.zoneShown = zi;
    const z = ZONE_DEF[zi % 4];
    UI.banner(t(z.key), clockAt(G.dist) + ' · ' + t('localTime'));
    Sound.play('zone');
  }
  // tutorial hints
  if (G.tutorial) tutorialHints();
  // badges mid-run
  G.achT -= dt;
  if (G.achT <= 0) { G.achT = 0.5; checkAch(runStats(), S.stats); }

  Sound.setIntensity(0.32 + clamp((G.speed - 21) / 26, 0, 1) * 0.68);
}

function updateEntities(dt, gdt) {
  const s = G.ship, sy = BASE_Y + s.y;
  for (let i = ENT.length - 1; i >= 0; i--) {
    const e = ENT[i];
    const rel = e.d - G.dist;
    if (rel < -14) { removeEnt(i); continue; }
    if (rel > AHEAD) continue;
    // closest approach this frame (swept, so fast frames can't tunnel)
    const near = e.d - clamp(e.d, G.prev, G.dist);
    const crossed = e.d > G.prev - 0.01 && e.d <= G.dist;
    switch (e.t) {
      case 'spire': case 'pillar': case 'post': case 'boulder': {
        if (e.t === 'boulder') {
          e.x = e.x0 + Math.sin(rel * e.k + e.ph) * e.amp;
          e.x = clamp(e.x, -TRACK + 0.5, TRACK - 0.5);
          e.mesh.position.x = e.x; e.mesh.rotation.z = -e.x / 1.15; e.mesh.rotation.x = rel * 0.9;
          e.extra[0].position.x = e.x;
        }
        const dx = s.x - e.x, rr = e.r + 0.42;
        if (!e.done && dx * dx + near * near < rr * rr) { e.done = true; if (hit(e, i)) { if (G.state !== 'play') return; continue; } }
        if (!e.passed && rel < 0) {
          e.passed = true;
          const clear = Math.abs(dx) - rr;
          if (!e.done && clear < 0.7 && clear > -0.05) graze(e, clear);
        }
        break;
      }
      case 'ridge': {
        if (crossed && !e.done) {
          e.done = true;
          if (s.y < 0.5) { if (hit(e, i)) { if (G.state !== 'play') return; continue; } }
          else { G.ridges++; addBonus(10); if (s.y < 0.85) { popup(t('skim'), s.x, 2.4, -G.dist, 'mint'); G.grazes++; comboAdd(1); Sound.play('graze'); } }
        }
        break;
      }
      case 'gate': {
        if (crossed && !e.done) {
          e.done = true;
          const lo = e.gx - e.gw / 2, hi = e.gx + e.gw / 2;
          if (s.x - 0.42 < lo || s.x + 0.42 > hi) { if (hit(e, i)) { if (G.state !== 'play') return; continue; } }
          else { const clear = Math.min(s.x - 0.42 - lo, hi - s.x - 0.42); if (clear < 0.55) graze(e, clear); }
        }
        break;
      }
      case 'shard': {
        e.mesh.rotation.y += gdt * 3; e.mesh.position.y = e.y + Math.sin(G.runT * 4 + e.d) * 0.08;
        if (G.magnet > 0 && rel < 16 && rel > -1.5) {
          e.x = damp(e.x, s.x, 7, gdt); e.y = damp(e.y, sy, 7, gdt); e.d = damp(e.d, G.dist + 0.3, 5, gdt);
          e.mesh.position.set(e.x, e.y, -e.d);
        }
        const dy = sy - e.y, dx = s.x - e.x;
        if (Math.abs(near) < 0.9 && Math.abs(dx) < 0.95 && Math.abs(dy) < 1.05) {
          G.shards += G.fever > 0 ? 2 : 1; G.streak++;
          if (G.streak % 5 === 0) comboAdd(1);
          addBonus(10);
          Sound.play('shard', G.streak % 11);
          FX.emit(e.x, e.y, -e.d, { n: 7, color: '#FFE07A', speed: 3.5, life: 0.45, size: 0.45, grav: 0 });
          removeEnt(i); continue;
        }
        if (!e.passed && rel < -1) { e.passed = true; G.streak = 0; }
        break;
      }
      case 'ring': {
        e.mesh.rotation.z += gdt * 0.8;
        if (e.got) e.mesh.scale.multiplyScalar(Math.max(0, 1 - gdt * 7));
        if (crossed && !e.done) {
          e.done = true;
          const dx = Math.abs(s.x - e.x);
          if (dx < 1.2 && s.y < 1.25) {
            const perfect = dx < 0.42;
            G.rings++; if (perfect) G.perfects++;
            addBonus(perfect ? 80 : 40); comboAdd(perfect ? 2 : 1);
            Sound.play('ring', perfect);
            popup(perfect ? t('perfect') : t('ring'), e.x, 2.6, -e.d, perfect ? 'gold' : '');
            FX.emit(e.x, 1.05, -e.d, { n: perfect ? 22 : 12, color: '#FFC94D', speed: 6, life: 0.6, size: 0.5, grav: 0 });
            e.got = true;
          }
        }
        break;
      }
      case 'power': {
        e.mesh.rotation.y += gdt * 1.5; e.mesh.position.y = 1.1 + Math.sin(G.runT * 3) * 0.15;
        e.mesh.userData.core.rotation.x += gdt * 2;
        const dx = s.x - e.x;
        if (Math.abs(near) < 1.1 && Math.abs(dx) < 1.25 && Math.abs(sy - 1.1) < 1.3) {
          activatePower(e.kind);
          FX.emit(e.x, 1.1, -e.d, { n: 20, color: '#' + e.mesh.userData.core.material.color.getHexString(), speed: 6, life: 0.7, size: 0.6, grav: 0 });
          removeEnt(i); continue;
        }
        break;
      }
      case 'meteor': {
        const mk = e.mesh, mt = e.extra[0];
        if (!e.landed) {
          if (rel < 120) {
            const p = clamp(1 - (rel - 24) / 96, 0, 1);
            mk.scale.setScalar(0.4 + p * 0.7 + Math.sin(G.runT * 10) * 0.05);
            mt.visible = true;
            const u = Math.max(rel - 24, 0);
            mt.position.set(e.x + u * 0.35, 0.9 + u * 1.2, -(e.d + u * 0.35));
            mt.userData.rock.rotation.x += gdt * 4;
          }
          if (rel <= 24) {
            e.landed = true;
            release(mk); e.mesh = null;
            mt.position.set(e.x, 0.55, -e.d); mt.userData.tail.visible = false; mt.userData.rock.scale.set(1, 0.75, 1);
            FX.emit(e.x, 0.4, -e.d, { n: 22, colors: ['#FFC98A', '#FF7A6B', '#FFF3E2'], speed: 7, life: 0.8, size: 0.8, grav: -4 });
            Sound.play('impact'); G.shake = Math.max(G.shake, 0.22); haptic(10);
          }
        } else {
          const dx = s.x - e.x, rr = e.r + 0.42;
          if (!e.done && dx * dx + near * near < rr * rr) {
            e.done = true;
            if (s.y < 0.62) { if (hit(e, i)) { if (G.state !== 'play') return; continue; } }
          }
          if (!e.passed && rel < 0) { e.passed = true; const clear = Math.abs(dx) - rr; if (!e.done && clear < 0.6 && clear > -0.05) graze(e, clear); }
        }
        break;
      }
      case 'showerStart':
        if (rel < 0) { G.inShower = true; UI.banner(t('meteor'), t('meteorSub')); removeEnt(i); continue; }
        break;
      case 'showerEnd':
        if (rel < 0) { G.inShower = false; G.showers++; addBonus(100); removeEnt(i); continue; }
        break;
      case 'arch':
        if (!e.passed && rel < 0) { e.passed = true; Sound.play('milestone'); popup(fmt(e.n) + ' m', s.x, 3, -G.dist, 'gold'); addBonus(50); }
        break;
      default: break;
    }
  }
}

function tutorialHints() {
  const d = G.dist, k = INPUT.touchUI;
  const st = [
    [15, () => UI.hint(k ? t('hintSteer') : t('hintSteerKeys'), '')],
    [200, () => UI.hint(null)],
    [255, () => UI.hint(k ? t('hintHop') : t('hintHopKeys'), 'tap')],
    [440, () => UI.hint(null)],
    [455, () => UI.hint(k ? t('hintRoll') : t('hintRollKeys'), 'down')],
